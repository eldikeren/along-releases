name: Publish an Android APK

# Hosts a new Along APK here, on this PUBLIC repo, so anyone can download it
# signed out. The permanent link along.cohorta-ai.com/api/install-android
# points at releases/latest/download/Along.apk, so each new release becomes
# the download with no link change.

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'EAS APK URL (https://expo.dev/artifacts/eas/....apk)'
        type: string
        required: true
      version_code:
        description: 'Android versionCode of the build'
        type: string
        required: true
      version:
        description: 'App version'
        type: string
        default: '3.0.0'

permissions:
  contents: write

concurrency:
  group: publish-apk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check inputs
        env:
          APK: ${{ inputs.apk_url }}
          VC: ${{ inputs.version_code }}
          VER: ${{ inputs.version }}
        run: |
          [[ "$APK" =~ ^https://expo\.dev/artifacts/eas/[A-Za-z0-9_-]+\.apk$ ]] || { echo "::error::not an EAS APK URL"; exit 1; }
          [[ "$VC" =~ ^[0-9]+$ ]] || { echo "::error::bad version_code"; exit 1; }
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version"; exit 1; }
      - name: Download the APK
        env:
          APK: ${{ inputs.apk_url }}
        run: |
          curl -sSfL -o Along.apk "$APK"
          size=$(stat -c %s Along.apk)
          echo "size: $size"
          [ "$size" -gt 20000000 ] || { echo "::error::APK too small"; exit 1; }
          head -c 2 Along.apk | grep -q PK || { echo "::error::not an APK (zip)"; exit 1; }
          cp Along.apk "Along-${{ inputs.version }}-vc${{ inputs.version_code }}.apk"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}-vc${{ inputs.version_code }}
        run: |
          gh release create "$TAG" Along.apk "Along-${{ inputs.version }}-vc${{ inputs.version_code }}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Along ${{ inputs.version }} (Android ${{ inputs.version_code }})" \
            --notes "Newest Along for Android. Permanent install link: https://along.cohorta-ai.com/download" \
            --latest
      - name: Check the permanent asset URL
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Along.apk"
          code=$(curl -sSL -o /dev/null -r 0-0 -w '%{http_code}' "$url")
          echo "HTTP $code for $url"
          case "$code" in 200|206) ;; *) exit 1;; esac
